
version: '3.8'

services:
  wsbarly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wsbarly_app
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # PERSISTENCE:
      # All application data (profiles, sessions, history) is now stored in /app/data
      # Mapping this volume ensures data survives container updates.
      - ./app_data:/app/data
