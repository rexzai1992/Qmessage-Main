<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#00a884" />
    <title>QMessage Offline</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f0f2f5;
            color: #111b21;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e3e8ec;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
        .title {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: 800;
        }
        .text {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            color: #54656f;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 class="title">You are offline</h1>
        <p class="text">QMessage is waiting for network access. Reopen when your connection is back to continue realtime chat.</p>
    </main>
</body>
</html>
